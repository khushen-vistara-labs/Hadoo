name: Hadoo checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hadoo-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    name: Standalone app analysis and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve locked mobile dependencies
        run: ./hadoo setup
      - name: Check app sources and focused player/catalog/car regressions
        run: ./hadoo check
      # No signing keys, account sessions or proprietary APK inputs needed.
      # Native package builds and physical car/device acceptance are separate.

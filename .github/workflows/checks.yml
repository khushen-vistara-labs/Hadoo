name: Hadoo checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hadoo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, branding, and official patch compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Python syntax
        run: python3 -m compileall -q tools tests hadoo
      - name: Download checksum-pinned upstream tools and export branding
        run: ./hadoo setup
      - name: Run tests including the local defaults add-on
        run: ./hadoo check
      - name: Verify the profile against the actual upstream bundle
        run: ./hadoo patches
      # Builds, APK inputs, signing keys and device/account data stay local.
